<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chethan's Diary</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;600;700;800&display=swap');
:root{--bg:#07070a;--card:#111119;--line:#292936;--txt:#f7f7fb;--muted:#9292a1;--a:#9b7cff;--b:#ff6b9d}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--txt);font-family:Manrope;background:radial-gradient(circle at 15% 0,#271a50,transparent 35%),radial-gradient(circle at 100% 15%,#3b182b,transparent 30%),var(--bg)}main{max-width:1150px;margin:auto;padding:25px 20px 80px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.brand i{color:var(--a);font-style:normal}.ey{font:11px 'DM Mono';letter-spacing:1.5px;color:var(--a)}h1{font-size:clamp(45px,8vw,82px);line-height:.9;letter-spacing:-5px;margin:12px 0}.hero{padding:75px 0 35px}.hero p{color:var(--muted)}button{border:0;border-radius:13px;padding:12px 17px;color:#fff;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 30px #9b7cff22}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{min-height:190px;padding:22px;border:1px solid var(--line);border-radius:24px;background:#111119cc;cursor:pointer;transition:.2s;position:relative}.card:hover{transform:translateY(-3px);border-color:#51496d}.date{font:11px 'DM Mono';color:var(--muted)}.card h3{margin:18px 0 8px}.summary{font-size:14px;line-height:1.6;color:#bcbcca}.pill{position:absolute;right:17px;top:17px;font-size:9px;font-weight:800;padding:6px 9px;border-radius:99px;background:#1d1d29;color:#aaa}.missed{border-color:#4a252d}.missed .pill{color:#ff8994;background:#321820}.write{display:flex;align-items:center;justify-content:center;border-style:dashed}.plus{font-size:50px;color:var(--a);text-align:center}.login,.modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:#000c;backdrop-filter:blur(15px)}.login{background:#050507}.box{width:min(720px,100%);padding:35px;border:1px solid #302e3d;border-radius:28px;background:#101017;box-shadow:0 30px 100px #000}.loginbox{width:min(430px,100%);text-align:center}.input,textarea{width:100%;padding:14px;border-radius:14px;border:1px solid #292936;background:#09090d;color:#fff;font:inherit;outline:0}textarea{min-height:260px;margin:16px 0}.row{display:flex;justify-content:flex-end;gap:10px}.secondary{background:#1b1b24;box-shadow:none}.hidden{display:none!important}.err{color:#ff7080;font-size:12px;min-height:20px;padding-top:8px}@media(max-width:600px){.hero{padding-top:55px}h1{letter-spacing:-3px}}</style></head><body>
<div id="login" class="login"><div class="box loginbox"><div class="ey">PRIVATE DIARY • IST</div><h2>Welcome, Chethan.</h2><p style="color:var(--muted)">Your thoughts. Your space. Nobody else.</p><input id="pw" class="input" type="password" inputmode="numeric" placeholder="Enter your password"><br><br><button id="go" style="width:100%">Unlock diary</button><div id="err" class="err"></div></div></div>
<main id="app" class="hidden"><header class="top"><div class="brand">CHEthan<i>•</i>DIARY</div><button id="lock" class="secondary">Lock</button></header><section class="hero"><div id="clock" class="ey"></div><h1>Dear diary.</h1><p id="status">Loading your private timeline…</p></section><section id="cards" class="grid"></section></main>
<div id="wm" class="modal hidden"><div class="box"><div id="wd" class="date"></div><h2>Today, privately.</h2><textarea id="txt" placeholder="Write whatever you want. This is your space."></textarea><div class="row"><button id="cancel" class="secondary">Cancel</button><button id="save">Save entry</button></div></div></div>
<div id="vm" class="modal hidden"><div class="box"><div id="vd" class="date"></div><h2 id="vt"></h2><p id="vb" style="white-space:pre-wrap;color:#c8c8d2;line-height:1.8"></p><div class="row"><button id="close">Close</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://nzaelikbjumaidaombmp.supabase.co',SUPABASE_KEY='sb_publishable_IupVMhCmigAk4n5bTbRrjg_Fr05v-HE',$=x=>document.getElementById(x),pad=x=>String(x).padStart(2,'0');let db=null;
const now=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'})),today=()=>{let d=now();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},pretty=x=>new Date(x+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function clock(){let d=now();$('clock').textContent='IST • '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+' • '+pretty(today());setTimeout(clock,1000)}clock();
try{if(!window.supabase)throw new Error('Supabase library did not load.');db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}})}catch(e){$('err').textContent='Setup error: '+e.message} $('go').addEventListener('click',login);$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
async function login(){let b=$('go');$('err').textContent='';b.disabled=true;b.textContent='Unlocking…';try{if(!db)throw new Error('Supabase is not connected.');let password=$('pw').value;if(!password)throw new Error('Enter your password.');let r=await db.auth.signInWithPassword({email:'chethan@personaldiary.local',password});if(r.error)throw r.error;$('login').classList.add('hidden');$('app').classList.remove('hidden');await render()}catch(e){$('err').textContent='Login failed: '+(e.message||String(e))}finally{b.disabled=false;b.textContent='Unlock diary'}}
$('lock').onclick=async()=>{await db?.auth.signOut();location.reload()};
async function render(){let r=await db.from('diary_entries').select('id,entry_date,content').order('entry_date',{ascending:false});if(r.error)return $('status').textContent='Could not load diary.';let data=r.data||[],td=today(),open=now().getHours()<12,has=data.some(e=>e.entry_date===td);$('status').textContent=has?'Today is recorded. '+data.length+' private day'+(data.length===1?'':'s')+'.':open?'Today is waiting for you. The diary closes at 12:00 PM IST.':'Today is locked. It reopens at 12:00 AM IST.';let out=$('cards');out.innerHTML='';
if(open&&!has){let c=document.createElement('div');c.className='card write';c.innerHTML='<div><div class="plus">+</div><div style="color:#aaa;text-align:center">Write today</div></div>';c.onclick=()=>write(td);out.appendChild(c)}
let oldest=data.length?data[data.length-1].entry_date:td,s=new Date(oldest+'T00:00:00'),end=new Date(td+'T00:00:00');s.setDate(s.getDate()+1);for(let d=new Date(s);d<end;d.setDate(d.getDate()+1)){let ds=d.toISOString().slice(0,10);if(!data.some(e=>e.entry_date===ds)){let c=document.createElement('div');c.className='card missed';c.innerHTML='<span class="pill">MISSED</span><div class="date">'+pretty(ds)+'</div><h3>You missed this day.</h3><div class="summary">No entry was recorded before 12:00 PM IST.</div>';out.appendChild(c)}}
data.forEach(e=>{let c=document.createElement('div');c.className='card';let s=e.content.replace(/\s+/g,' ').trim();s=s.length>145?s.slice(0,142)+'…':s;c.innerHTML='<span class="pill">PRIVATE</span><div class="date">'+pretty(e.entry_date)+'</div><h3>'+(e.entry_date===td?'Today':'A day in your story')+'</h3><div class="summary">'+s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))+'</div>';c.onclick=()=>view(e);out.appendChild(c)})}
function write(d){$('wd').textContent=pretty(d);$('txt').value='';$('wm').classList.remove('hidden')}function view(e){$('vd').textContent=pretty(e.entry_date);$('vt').textContent=e.entry_date===today()?'Today':'Your entry';$('vb').textContent=e.content;$('vm').classList.remove('hidden')}
$('cancel').onclick=()=>$('wm').classList.add('hidden');$('close').onclick=()=>$('vm').classList.add('hidden');$('save').onclick=async()=>{let content=$('txt').value.trim();if(!content)return;let r=await db.from('diary_entries').upsert({entry_date:today(),content},{onConflict:'user_id,entry_date'});if(r.error)return alert(r.error.message);$('wm').classList.add('hidden');render()};
</script></body></html>
